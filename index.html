<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mi GBA</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #111;
            font-family: Arial, sans-serif;
            color: white;
        }

        #menu {
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px;
        }

        #menu h1 {
            margin-bottom: 35px;
            font-size: 32px;
        }

        .games {
            display: flex;
            gap: 25px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .game {
            width: 220px;
            height: 220px;
            background: #222;
            border: 2px solid #444;
            border-radius: 15px;
            cursor: pointer;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            text-align: center;
            padding: 20px;

            transition: 0.2s;
        }

        .game:hover {
            transform: scale(1.05);
            border-color: #7f7f7f;
            background: #2c2c2c;
        }

        .game h2 {
            font-size: 20px;
            margin: 0;
        }

        .game p {
            font-size: 13px;
            color: #aaa;
            margin-top: 10px;
        }

        .game-upload {
            border: 2px dashed #666;
            background: #1a1a1a;
        }
        
        .game-upload:hover {
            border-color: #4caf50;
            background: #1e2e1f;
        }

        #emulator {
            display: none;
            width: 100%;
            height: 100%;
        }

        #game {
            width: 100%;
            height: 100%;
        }

        #back {
            position: fixed;
            top: 10px;
            left: 10px;
            z-index: 99999;

            padding: 10px 15px;

            background: rgba(0,0,0,0.7);
            color: white;

            border: 1px solid #555;
            border-radius: 8px;

            cursor: pointer;
            font-size: 14px;

            display: none;
        }

        #back:hover {
            background: rgba(50,50,50,0.9);
        }
    </style>
</head>

<body>

    <div id="menu">

        <h1>CONTENEDOR SECRETO</h1>

        <div class="games">

            <div class="game" onclick="startPreloadedGame('Apotris', 'https://catbox.moe')">
                <h2>Apotris</h2>
                <p>tetrisbasicamente</p>
            </div>

            <div class="game" onclick="startPreloadedGame('CastleHOD', 'https://catbox.moe')">
                <h2>Castle</h2>
                <p>HOD</p>
            </div>

            <div class="game" onclick="startPreloadedGame('Pokémon', 'https://catbox.moe')">
                <h2>Pokmn</h2>
                <p>poke</p>
            </div>
            
            <div class="game game-upload" onclick="document.getElementById('file-input').click()">
                <h2>rom Local</h2>
                <p>.gba</p>
                <input type="file" id="file-input" accept=".gba,.zip" style="display: none;" onchange="loadLocalRom(event)">
            </div>

        </div>

    </div>

    <div id="emulator">
        <div id="game-container">
            <div id="game"></div>
        </div>
    </div>

    <button id="back" onclick="backToMenu()">← Volver al menú</button>

    <script>
        function startPreloadedGame(name, url) {
            setEmulatorSettings();
            window.EJS_gameName = name;
            window.EJS_gameUrl = url;

            launchEmulator();
        }

        function loadLocalRom(event) {
            const file = event.target.files;
            if (!file) return;

            setEmulatorSettings();
            window.EJS_gameName = file.name.replace(/\.[^/.]+$/, "");
            window.EJS_gameUrl = URL.createObjectURL(file);

            launchEmulator();
        }

        function setEmulatorSettings() {
            window.EJS_player = "#game";
            window.EJS_core = "gba";
            window.EJS_color = "#7f7f7f";
            window.EJS_startOnLoaded = true;
            window.EJS_pathtodata = "https://emulatorjs.org";
            window.EJS_language = "en-US";

            window.EJS_WebAudio = true;

            if (/Mobi|Android|iPhone/i.test(navigator.userAgent)) {
                window.EJS_threads = "1";
            }
        }

        function launchEmulator() {
            document.getElementById("menu").style.display = "none";
            document.getElementById("emulator").style.display = "block";
            document.getElementById("back").style.display = "block";

            const oldScript = document.getElementById("emu-script");
            if (oldScript) oldScript.remove();

            document.getElementById("game-container").innerHTML = '<div id="game"></div>';

            const script = document.createElement("script");
            script.id = "emu-script";
            script.src = "https://emulatorjs.orgloader.js";
            document.body.appendChild(script);
        }

        function backToMenu() {
            window.EJS_gameUrl = null;
            location.reload();
        }
    </script>

</body>
</html>
